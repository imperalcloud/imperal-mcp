[project]
name = "imperal-mcp"
version = "0.8.13"
readme = "README.md"
description = "The exoskeleton for your AI coding agent: memory across sessions, a live code map, undo for every change and a hallucination check. MCP server for Claude Code, Cursor, Codex, Gemini CLI."
requires-python = ">=3.7"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Valentin Scerbacov", email = "valentin@imperal.io" }, { name = "Imperal, Inc." }]
keywords = ["mcp", "mcp-server", "model-context-protocol", "claude-code", "cursor", "codex", "gemini-cli", "ai-agents", "coding-agent", "ai-memory", "agent-memory", "hallucination", "code-graph", "tree-sitter", "context-engineering", "llm", "developer-tools", "icnli"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Every dependency needs Python 3.10+ (the MCP SDK, pydantic 2). On 3.7-3.9 pip installs none of
# them, and the `imperal-mcp` command (imperal_mcp/_launch.py) runs this same release on a Python
# 3.12 it sets up once with uv -- `uv` comes as a wheel on 3.8+, 3.7 downloads uv's release build.
dependencies = [
    'mcp>=1.2.0,<2; python_version >= "3.10"',
    'imperal-sdk>=6.2.0; python_version >= "3.10"',
    'httpx>=0.27; python_version >= "3.10"',
    'uv>=0.4; python_version >= "3.8" and python_version < "3.10"',
]

[project.urls]
Homepage = "https://imperal.io"
Repository = "https://github.com/imperalcloud/imperal-mcp"
Documentation = "https://github.com/imperalcloud/imperal-mcp#readme"
Protocol = "https://icnli.org"

[project.scripts]
imperal-mcp = "imperal_mcp._launch:main"

[project.optional-dependencies]
code = [
    'webbee>=0.5.11; python_version >= "3.10"',
    'tree-sitter>=0.23; python_version >= "3.10" and (sys_platform != "darwin" or platform_machine != "x86_64" or python_version < "3.13")',
    'tree-sitter-python>=0.23; python_version >= "3.10" and (sys_platform != "darwin" or platform_machine != "x86_64" or python_version < "3.13")',
    'tree-sitter-typescript>=0.23; python_version >= "3.10" and (sys_platform != "darwin" or platform_machine != "x86_64" or python_version < "3.13")',
    'tree-sitter-javascript>=0.23; python_version >= "3.10" and (sys_platform != "darwin" or platform_machine != "x86_64" or python_version < "3.13")',
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imperal_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
